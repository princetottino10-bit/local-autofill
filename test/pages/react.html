<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Reactの制御フォーム</title>
<script src="../../node_modules/react/umd/react.production.min.js"></script>
<script src="../../node_modules/react-dom/umd/react-dom.production.min.js"></script></head>
<body><div id="root"></div><script>
const e = React.createElement;
const FIELDS = [
  ['lastName', '姓', 'text', 'family-name'], ['firstName', '名', 'text', 'given-name'],
  ['lastKana', 'セイ', 'text'], ['firstKana', 'メイ', 'text'],
  ['email', 'Email', 'email', 'email'], ['zip', '郵便番号（ハイフンなし）', 'text', 'postal-code'],
  ['address1', '住所1（市区町村・番地）', 'text'], ['address2', '住所2（建物名）', 'text'],
  ['birthday', '生年月日', 'date'],
];
function App() {
  const [s, set] = React.useState({ pref: '' });
  const onChange = (k) => (ev) => set((o) => ({ ...o, [k]: ev.target.value }));
  return e('form', null,
    e('dl', null, ...FIELDS.flatMap(([k, lab, type, ac]) => [
      e('dt', { key: k + 'l' }, e('label', { htmlFor: k }, lab)),
      e('dd', { key: k }, e('input', { id: k, type, autoComplete: ac, value: s[k] || '', onChange: onChange(k) })),
    ]),
    e('dt', null, e('label', { htmlFor: 'pref' }, '都道府県')),
    e('dd', null, e('select', { id: 'pref', value: s.pref, onChange: onChange('pref') },
      e('option', { value: '' }, '選択してください'), e('option', { value: '13' }, '東京'), e('option', { value: '27' }, '大阪')))),
    e('pre', { id: 'state' }, JSON.stringify(s)));
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script></body></html>
