<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>表形式のフォーム</title></head>
<body><form><table>
<tr><th>お名前 <em>※</em></th><td><span>姓</span><input name="f01"> <span>名</span><input name="f02"></td></tr>
<tr><th>フリガナ <em>※</em></th><td>セイ<input name="f03"> メイ<input name="f04"></td></tr>
<tr><th>生年月日</th><td><select name="f05"><option value="">--</option><option>1988</option><option>1989</option><option>1990</option></select>年
<select name="f06"><option value="">--</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>月
<select name="f07"><option value="">--</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>日</td></tr>
<tr><th>性別</th><td><label><input type="radio" name="f08" value="1">男性</label><label><input type="radio" name="f08" value="2">女性</label></td></tr>
<tr><th>電話番号（半角）</th><td><input name="f09" maxlength="3" size="4">-<input name="f10" maxlength="4" size="5">-<input name="f11" maxlength="4" size="5"></td></tr>
<tr><th>メールアドレス</th><td><input name="f12"></td></tr>
<tr><th>メールアドレス（確認用）</th><td><input name="f13"></td></tr>
<tr><th>郵便番号</th><td><input name="f14" placeholder="123-4567"></td></tr>
<tr><th>ご住所（全角）</th><td><textarea name="f15"></textarea></td></tr>
<tr><th>件名</th><td><input name="f16"></td></tr>
<tr><th>会社名</th><td><input name="f17"></td></tr>
</table></form></body></html>
