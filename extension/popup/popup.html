<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ローカル入力</title>
  <link rel="stylesheet" href="../lib/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div>
      <h1>ローカル入力</h1>
      <p class="host" id="host">&nbsp;</p>
    </div>
    <a class="link" id="open-options" href="#">名簿を開く</a>
  </header>

  <section id="empty" class="card" hidden>
    <p>名簿がまだありません。最初にCSVを取り込むか、人を登録してください。</p>
    <button class="primary" id="create-profile">名簿を開く</button>
  </section>

  <section id="main" hidden>
    <div class="search-row">
      <input type="search" id="search" placeholder="名前・ふりがな・電話で検索" autocomplete="off">
      <label class="check small"><input type="checkbox" id="todo-only" checked> 未入力のみ</label>
    </div>
    <p class="progress" id="progress"></p>
    <ul id="people" class="people" role="listbox" aria-label="名簿"></ul>

    <div class="current card" id="current">
      <div class="current-head">
        <div>
          <p class="current-name" id="current-name"></p>
          <p class="current-sub" id="current-sub"></p>
        </div>
        <span class="badge" id="current-badge"></span>
      </div>
    </div>

    <button class="primary big" id="fill">この人をページに入力</button>
    <div class="row-buttons">
      <button id="done-next" class="accent-outline">入力済みにして次の人へ</button>
    </div>
    <p class="hint">空欄だけに入力します。送信はご自身で。<span id="sc-hint"><kbd id="shortcut">⌥⇧F</kbd> でも入力できます。</span></p>
    <label class="check"><input type="checkbox" id="overwrite"> 入力済みの欄も上書きする</label>

    <div id="result" class="result" hidden></div>

    <div class="row-buttons">
      <button id="review">欄の割り当てを確認</button>
      <button id="undo">入力を元に戻す</button>
    </div>

    <section id="review-panel" hidden>
      <p class="hint">違っている欄があれば選び直して保存すると、次回からこのサイトでは同じ割り当てを使います。</p>
      <ul id="field-list" class="field-list"></ul>
      <div class="row-buttons">
        <button class="primary" id="save-rules">このサイト用に保存して入力し直す</button>
        <button id="reset-rules">このサイトの指定をリセット</button>
      </div>
    </section>
  </section>

  <footer>データはこのパソコンの中だけに保存され、外部には送信されません。</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
